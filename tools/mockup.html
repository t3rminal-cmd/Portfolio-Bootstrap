<!doctype html>
<!-- Project screenshot frame: a floating browser window over a soft gray backdrop.
     Used by tools/mockup.js; see the README for how to make a new screenshot. -->
<html><head><meta charset="utf-8"><title>Mockup</title><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:825px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,#e6e7e9 0%,transparent 70%),linear-gradient(135deg,#b4b6ba 0%,#d3d5d8 55%,#e4e5e7 100%);}
.win{position:absolute;left:50%;top:50%;width:880px;transform:translate(-50%,-50%);border-radius:12px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.08),0 30px 60px -10px rgba(0,0,0,.35),0 60px 110px -20px rgba(0,0,0,.3);}
.bar{height:34px;display:flex;align-items:center;gap:7px;padding:0 14px;background:#eef0f2;border-bottom:1px solid #dadde1}
.bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.url{margin-left:18px;flex:0 1 380px;height:20px;border-radius:6px;background:#fff;border:1px solid #dadde1;font-size:11px;color:#6b7280;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.win img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.feat .win{left:47%;width:820px}
.phone{position:absolute;right:108px;bottom:70px;width:210px;border-radius:32px;padding:9px;background:#15171b;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 30px 60px -10px rgba(0,0,0,.45),0 60px 100px -20px rgba(0,0,0,.35)}
.phone[hidden]{display:none}
.phone img{display:block;width:100%;border-radius:24px}
.phone::before{content:"";position:absolute;top:15px;left:50%;width:58px;height:16px;margin-left:-29px;border-radius:10px;background:#15171b;z-index:1}
</style></head><body>
<div class="win"><div class="bar"><i></i><i></i><i></i><span class="url" id="url"></span></div><img id="shot" alt=""></div>
<div class="phone" id="phone" hidden><img id="phone-shot" alt=""></div>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById("url").textContent = q.get("url") || "";
  document.getElementById("shot").src = q.get("img");
  if (q.get("phone")) {
    document.body.className = "feat";
    document.getElementById("phone").hidden = false;
    document.getElementById("phone-shot").src = q.get("phone");
  }
</script>
</body></html>
